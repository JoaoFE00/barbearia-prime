<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barbearia Prime — Administração</title>
  <style>
    :root {
      --fundo: #11110f;
      --painel: #1c1b18;
      --ouro: #c9a66b;
      --texto: #f5f0e7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: var(--fundo);
      color: var(--texto);
      font: 16px/1.5 Arial, sans-serif;
    }
    main { max-width: 960px; margin: 30px auto; }
    h1 { color: var(--ouro); }
    .card {
      background: var(--painel);
      border: 1px solid #514632;
      border-radius: 14px;
      padding: 22px;
      margin: 16px 0;
    }
    label { display: block; margin: 12px 0 5px; }
    input, button {
      font: inherit;
      padding: 11px;
      border-radius: 8px;
    }
    input {
      width: 100%;
      background: #292721;
      border: 1px solid #78684e;
      color: white;
    }
    button {
      cursor: pointer;
      border: 1px solid var(--ouro);
      background: var(--ouro);
      color: #111;
      font-weight: bold;
      margin: 5px 6px 5px 0;
    }
    button:disabled { opacity: .5; cursor: wait; }
    .secundario { background: transparent; color: var(--ouro); }
    .erro { color: #ffb0a7; }
    .sucesso { color: #b9e6ba; }
    .topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .reserva { border-top: 1px solid #514632; padding: 15px 0; }
    .reserva p { margin: 5px 0; overflow-wrap: anywhere; }
    .status { color: var(--ouro); font-weight: bold; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Barbearia Prime — Painel</h1>

    <section id="areaLogin" class="card">
      <h2>Entrar como administrador</h2>
      <form id="formLogin">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="username" required>

        <label for="senha">Senha</label>
        <input id="senha" type="password"
               autocomplete="current-password" required>

        <button id="botaoLogin" type="submit">Entrar</button>
      </form>
    </section>

    <section id="areaPainel" hidden>
      <div class="topo">
        <h2>Agendamentos</h2>
        <div>
          <button id="atualizar" class="secundario">Atualizar</button>
          <button id="sair" class="secundario">Sair</button>
        </div>
      </div>
      <div id="lista" class="card">Carregando...</div>
    </section>

    <p id="mensagem" role="status" aria-live="polite"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
   
    const SUPABASE_URL = "https://sgfktsmmzkeucvbcjcfe.supabase.co";
    const SUPABASE_PUBLIC_KEY = "sb_publishable_ascxshD8jfdnlxPm_Qfj1A_EtW6S2u9";

    const cliente = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLIC_KEY
    );

    const areaLogin = document.getElementById("areaLogin");
    const areaPainel = document.getElementById("areaPainel");
    const lista = document.getElementById("lista");
    const mensagem = document.getElementById("mensagem");
    const botaoLogin = document.getElementById("botaoLogin");

    function avisar(texto, tipo = "") {
      mensagem.textContent = texto;
      mensagem.className = tipo;
    }

    function dataHoraBrasil(valor) {
      return new Intl.DateTimeFormat("pt-BR", {
        timeZone: "America/Sao_Paulo",
        dateStyle: "short",
        timeStyle: "short"
      }).format(new Date(valor));
    }

    function texto(elemento, valor) {
      const paragrafo = document.createElement("p");
      paragrafo.textContent = valor;
      elemento.appendChild(paragrafo);
    }

    async function carregarAgendamentos() {
      lista.textContent = "Carregando agendamentos...";
      avisar("");

      const { data, error } =
        await cliente.rpc("admin_listar_agendamentos");

      if (error) {
        lista.textContent = "";
        avisar("Não foi possível carregar: " + error.message, "erro");
        return;
      }

      lista.replaceChildren();

      if (!data || !data.length) {
        lista.textContent = "Nenhum agendamento encontrado.";
        return;
      }

      for (const reserva of data) {
        const item = document.createElement("article");
        item.className = "reserva";

        texto(item, `Reserva nº ${reserva.id}`);
        texto(item, `Cliente: ${reserva.cliente_nome}`);
        texto(item, `Telefone: ${reserva.cliente_telefone}`);
        texto(item, `Serviço: ${reserva.servico}`);
        texto(item, `Profissional: ${reserva.barbeiro}`);
        texto(item, `Início: ${dataHoraBrasil(reserva.inicio)}`);
        texto(item, `Fim: ${dataHoraBrasil(reserva.fim)}`);

        const status = document.createElement("p");
        status.className = "status";
        status.textContent = `Status: ${reserva.status}`;
        item.appendChild(status);

        if (reserva.status === "pendente") {
          for (const novoStatus of ["confirmado", "cancelado"]) {
            const botao = document.createElement("button");
            botao.type = "button";
            botao.textContent =
              novoStatus === "confirmado" ? "Confirmar" : "Cancelar";

            if (novoStatus === "cancelado") {
              botao.className = "secundario";
            }

            botao.addEventListener("click", async () => {
              const acao =
                novoStatus === "confirmado" ? "confirmar" : "cancelar";

              if (!confirm(`Deseja ${acao} a reserva nº ${reserva.id}?`)) {
                return;
              }

              botao.disabled = true;

              const { error } =
                await cliente.rpc("admin_atualizar_agendamento", {
                  p_agendamento_id: reserva.id,
                  p_novo_status: novoStatus
                });

              if (error) {
                avisar("Não foi possível atualizar: " + error.message, "erro");
                botao.disabled = false;
                return;
              }

              await carregarAgendamentos();
              avisar("Agendamento atualizado.", "sucesso");
            });

            item.appendChild(botao);
          }
        }

        lista.appendChild(item);
      }
    }

    async function mostrarPainel() {
      areaLogin.hidden = true;
      areaPainel.hidden = false;
      await carregarAgendamentos();
    }

    document.getElementById("formLogin")
      .addEventListener("submit", async evento => {
        evento.preventDefault();
        botaoLogin.disabled = true;
        avisar("Entrando...");

        const { error } = await cliente.auth.signInWithPassword({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("senha").value
        });

        document.getElementById("senha").value = "";
        botaoLogin.disabled = false;

        if (error) {
          avisar("Não foi possível entrar: " + error.message, "erro");
          return;
        }

        await mostrarPainel();
      });

    document.getElementById("atualizar")
      .addEventListener("click", carregarAgendamentos);

    document.getElementById("sair")
      .addEventListener("click", async () => {
        await cliente.auth.signOut();
        areaPainel.hidden = true;
        areaLogin.hidden = false;
        lista.replaceChildren();
        avisar("Você saiu do painel.");
      });

    // Restaurar a sessão se o administrador já estiver conectado.
    cliente.auth.getSession().then(({ data, error }) => {
      if (error) {
        avisar("Erro ao verificar login: " + error.message, "erro");
      } else if (data.session) {
        mostrarPainel();
      }
    });
  </script>
</body>
</html>
